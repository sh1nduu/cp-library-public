body = """let mut g = vec![vec![]; ${1:n}];
for &(u, v) in &${2:uv} {
    g[u].push(v);
    g[v].push(u);
}
$0"""

[[snippet]]
id = "bfs"
label = "unweighted BFS"
description = "Compute distances with an unweighted BFS"
prefixes = ["cbfs"]
body = """let mut q = std::collections::VecDeque::new();
let mut dist = vec![usize::MAX; ${1:n}];

dist[${2:0}] = 0;
q.push_back($2);

while let Some(u) = q.pop_front() {
    for &v in &${3:g}[u] {
        if dist[v] == usize::MAX {
            dist[v] = dist[u] + 1;
            q.push_back(v);
        }
    }
}
$0"""

